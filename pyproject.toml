[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artisan-swarm"
version = "0.1.0"
description = "Evidence-grounded executable cooperation strategy discovery and repair"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
artisan-swarm = "artisan_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
artisan_swarm = ["static/*"]
